<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="blog/amaze/header::head-fragment"></head>
<body id="blog">
<div th:replace="blog/amaze/header::nav-fragment"></div>
<div th:replace="blog/amaze/header::header-fragment"></div>
<div class="am-g am-g-fixed blog-fixed">
    <main class="am-u-lg-8 am-u-sm-12 articles-list">
        <h2>文章分类</h2>
        <div class="tags" th:if="${not #lists.isEmpty(categories)}">
            <a rel="tag" th:each="category : ${categories}"
               th:href="@{'/category/' + ${category.categoryName}}"
               th:text="${category.categoryName}"></a>
        </div>
        <p th:if="${#lists.isEmpty(categories)}">暂无分类</p>
    </main>
    <aside class="am-u-lg-4 am-u-sm-12 sidebar-container">
        <section>
            <div class="sidebar-header">
                <span class="sidebar-header-title">热门标签</span>
            </div>
            <div class="tags" th:if="${not #lists.isEmpty(hotTags)}">
                <a rel="tag" th:each="hotTag : ${hotTags}"
                   th:href="@{'/tag/' + ${hotTag.tagName}}"
                   th:text="${hotTag.tagName} + '(' + ${hotTag.tagCount} + ')'"></a>
            </div>
            <p th:if="${#lists.isEmpty(hotTags)}">暂无标签</p>
        </section>
    </aside>
</div>
<footer th:replace="blog/amaze/footer::footer-fragment"></footer>
</body>
</html>
