<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{blog/amaze/layout :: head(${pageName})}"></head>
<body>
<th:block th:replace="~{blog/amaze/layout :: nav('categories')}"></th:block>

<main id="main">
    <section class="site-width page-banner">
        <span class="eyebrow">CATEGORIES</span>
        <h1>文章分类</h1>
        <p th:text="|共 ${#lists.size(categories)} 个分类|">共 0 个分类</p>
    </section>

    <div class="site-width wide-content">
        <section class="content-section">
            <div class="card-grid" th:unless="${#lists.isEmpty(categories)}">
                <a class="info-card" th:each="category : ${categories}"
                   th:href="@{/category/{name}(name=${category.categoryName})}">
                    <img th:unless="${#strings.isEmpty(category.categoryIcon)}" th:src="@{${category.categoryIcon}}" alt="">
                    <h3 th:text="${category.categoryName}">分类名</h3>
                    <span class="card-arrow">查看文章 →</span>
                </a>
            </div>
            <div class="empty-state" th:if="${#lists.isEmpty(categories)}">
                <div class="empty-symbol">✦</div>
                <h2>暂无分类</h2>
            </div>
        </section>

        <section class="content-section" th:unless="${#lists.isEmpty(hotTags)}">
            <div class="section-heading">
                <h2>热门标签<small>TAGS</small></h2>
            </div>
            <div class="tag-list">
                <a th:each="tag : ${hotTags}" th:href="@{/tag/{name}(name=${tag.tagName})}">
                    <th:block th:text="${tag.tagName}">标签</th:block><small th:text="${tag.tagCount}">0</small>
                </a>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{blog/amaze/layout :: footer}"></footer>
</body>
</html>
