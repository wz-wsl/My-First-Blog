<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!-- 文章详情页，也用于 /about 这类自定义路径的页面 -->
<head th:replace="~{blog/amaze/layout :: head(${blogDetailVO != null} ? ${blogDetailVO.blogTitle} : ${pageName})}"></head>
<body>
<th:block th:replace="~{blog/amaze/layout :: nav(${pageName == 'about'} ? 'about' : '')}"></th:block>

<main id="main" class="article-width" th:if="${blogDetailVO != null}">
    <header class="article-header">
        <div class="breadcrumbs">
            <a th:href="@{/}">首页</a>
            <th:block th:unless="${#strings.isEmpty(blogDetailVO.blogCategoryName)}">
                <span>/</span>
                <a th:href="@{/category/{name}(name=${blogDetailVO.blogCategoryName})}"
                   th:text="${blogDetailVO.blogCategoryName}">分类</a>
            </th:block>
        </div>
        <h1 th:text="${blogDetailVO.blogTitle}">文章标题</h1>
        <div class="article-meta">
            <img class="author-avatar" th:src="@{${configurations.get('yourAvatar')}}" alt="">
            <span th:text="${configurations.get('yourName')}">博主</span>
            <time th:text="${#dates.format(blogDetailVO.createTime, 'yyyy-MM-dd')}">2026-01-01</time>
            <a href="#comments" th:text="|${blogDetailVO.commentCount} 条评论|">0 条评论</a>
            <span th:text="|${blogDetailVO.blogViews} 浏览|">0 浏览</span>
        </div>
        <div class="tag-list" th:unless="${#lists.isEmpty(blogDetailVO.blogTags)}">
            <a th:each="tag : ${blogDetailVO.blogTags}" th:href="@{/tag/{name}(name=${tag})}" th:text="${tag}">标签</a>
        </div>
    </header>

    <!-- 正文是后端由 Markdown 转好的 HTML，所以用 utext -->
    <article class="article-content">
        <th:block th:utext="${blogDetailVO.blogContent}"></th:block>
        <p class="article-rights">本站文章除注明转载/出处外，皆为作者原创，欢迎转载，但未经作者同意必须保留此段声明，且在文章页面明显位置给出原文链接，否则保留追究法律责任的权利。</p>
    </article>

    <th:block th:with="hasComments=${commentPageResult != null and not #lists.isEmpty(commentPageResult.list)}">
    <section class="comments-section" id="comments" th:if="${hasComments or blogDetailVO.enableComment == 0}">
        <div class="section-heading">
            <h2>评论<small th:text="|${blogDetailVO.commentCount} COMMENTS|">0 COMMENTS</small></h2>
        </div>

        <th:block th:if="${hasComments}">
            <article class="comment" th:each="comment : ${commentPageResult.list}">
                <div class="comment-head">
                    <img class="author-avatar" th:src="@{/blog/amaze/images/avatar.png}" alt="">
                    <div>
                        <h3 th:text="${comment.commentator}">访客</h3>
                        <time th:text="${#dates.format(comment.commentCreateTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</time>
                    </div>
                </div>
                <p class="comment-body" th:text="${comment.commentBody}">评论内容</p>
                <div class="comment-reply" th:unless="${#strings.isEmpty(comment.replyBody)}">
                    <small th:text="|${configurations.get('yourName')} 回复 · ${#dates.format(comment.replyCreateTime, 'yyyy-MM-dd HH:mm')}|">博主回复</small>
                    <p th:text="${comment.replyBody}">回复内容</p>
                </div>
            </article>

            <nav th:replace="~{blog/amaze/fragments/pagination :: pagination(${commentPageResult}, ${'/blog/' + blogDetailVO.blogId + '?commentPage='}, '#comments')}"></nav>
        </th:block>

        <!-- 元素 id 供 /blog/plugins/comment/comment.js 读取，不要改名 -->
        <form class="comment-form" th:if="${blogDetailVO.enableComment == 0}" novalidate>
            <h2>发表评论</h2>
            <p>评论经博主审核后显示，邮箱不会公开，带 * 的为必填项。</p>
            <input type="hidden" id="blogId" th:value="${blogDetailVO.blogId}">
            <div class="form-grid">
                <label class="field">称呼 *
                    <input type="text" id="commentator" placeholder="怎么称呼你？">
                </label>
                <label class="field">邮箱 *
                    <input type="email" id="email" placeholder="你的联系邮箱">
                </label>
            </div>
            <label class="field">网站
                <input type="url" id="websiteUrl" placeholder="你的网站地址（可不填）">
            </label>
            <label class="field">验证码 *
                <span class="captcha-field">
                    <input type="text" id="verifyCode" placeholder="请输入右侧验证码" autocomplete="off">
                    <button class="captcha-refresh" type="button" title="看不清？点击刷新">
                        <img th:src="@{/common/kaptcha}" th:attr="data-src=@{/common/kaptcha}" alt="验证码">
                    </button>
                </span>
            </label>
            <label class="field">评论 *
                <textarea id="commentBody" placeholder="说点什么吧……（最多 200 字）" maxlength="200"></textarea>
            </label>
            <button class="button" type="button" id="commentSubmit">提交评论 <span>→</span></button>
        </form>
    </section>
    </th:block>
</main>

<main id="main" class="site-width wide-content" th:if="${blogDetailVO == null}">
    <div class="empty-state">
        <div class="empty-symbol">✦</div>
        <h2>文章不存在</h2>
        <p>它可能已被删除，回到 <a th:href="@{/}">首页</a> 看看别的吧。</p>
    </div>
</main>

<a class="back-top" href="#main" hidden>↑ 顶部</a>

<footer th:replace="~{blog/amaze/layout :: footer}"></footer>

<script th:src="@{/blog/plugins/highlight/highlight.pack.js}"></script>
<th:block th:if="${blogDetailVO != null and blogDetailVO.enableComment == 0}">
    <script th:src="@{/blog/plugins/jquery/jquery.min.js}"></script>
    <script th:src="@{/admin/plugins/sweetalert/sweetalert.min.js}"></script>
    <script th:src="@{/blog/plugins/comment/valid.js}"></script>
    <script th:src="@{/blog/plugins/comment/comment.js}"></script>
</th:block>
</body>
</html>
