<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{blog/amaze/layout :: head(${pageName})}"></head>
<body>
<th:block th:replace="~{blog/amaze/layout :: nav('link')}"></th:block>

<main id="main">
    <section class="site-width page-banner">
        <span class="eyebrow">FRIENDS</span>
        <h1>友情链接</h1>
        <p>那些值得常去看看的地方。</p>
    </section>

    <div class="site-width wide-content">
        <section th:replace="~{:: link-group('友链', 'FRIENDS', ${favoriteLinks})}"></section>
        <section th:replace="~{:: link-group('推荐网站', 'RECOMMENDED', ${recommendLinks})}"></section>
        <section th:replace="~{:: link-group('个人链接', 'PERSONAL', ${personalLinks})}"></section>

        <section class="content-section link-note">
            <h2>链接须知</h2>
            <p>欢迎互换友链 ^_^ 不过请确定贵站可以正常运营。</p>
            <p th:unless="${#strings.isEmpty(configurations.get('yourEmail'))}">
                申请请发邮件至
                <a th:href="'mailto:' + ${configurations.get('yourEmail')}"
                   th:text="${configurations.get('yourEmail')}">邮箱</a>，格式如下：
            </p>
            <ul>
                <li>网站名称：<th:block th:text="${configurations.get('websiteName')}">站点名</th:block></li>
                <li>网站链接：https://你的域名</li>
                <li>网站描述：<th:block th:text="${configurations.get('websiteDescription')}">站点描述</th:block></li>
            </ul>
            <p>请保证自己的链接长期有效，不然可能会被清理。</p>
        </section>
    </div>
</main>

<footer th:replace="~{blog/amaze/layout :: footer}"></footer>
<th:block th:if="false">
<!-- 一组链接卡片，三组共用；分组为空时不显示 -->
<section class="content-section" th:fragment="link-group(title, caption, links)" th:unless="${#lists.isEmpty(links)}">
    <div class="section-heading">
        <h2><th:block th:text="${title}">友链</th:block><small th:text="${caption}">FRIENDS</small></h2>
    </div>
    <div class="card-grid">
        <a class="info-card" th:each="link : ${links}" th:href="${link.linkUrl}" target="_blank" rel="noopener">
            <h3 th:text="${link.linkName}">网站名称</h3>
            <p th:text="${link.linkDescription}">网站描述</p>
            <span class="card-arrow">访问 ↗</span>
        </a>
    </div>
</section>
</th:block>
</body>
</html>
