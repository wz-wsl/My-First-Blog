<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!-- 标签、分类、搜索的文章列表页，靠 pageUrl（tag / category / search）和 keyword 区分 -->
<head th:replace="~{blog/amaze/layout :: head(|${pageName} · ${keyword}|)}"></head>
<body>
<th:block th:replace="~{blog/amaze/layout :: nav(${pageUrl == 'category'} ? 'categories' : '')}"></th:block>

<main id="main">
    <section class="site-width page-banner">
        <span class="eyebrow" th:text="${pageUrl == 'tag'} ? 'TAG' : (${pageUrl == 'category'} ? 'CATEGORY' : 'SEARCH')">TAG</span>
        <h1 th:text="|${pageName} · ${keyword}|">标签 · Java</h1>
        <p th:if="${blogPageResult != null}" th:text="|共 ${blogPageResult.totalCount} 篇文章|">共 0 篇文章</p>
    </section>

    <div class="site-width blog-layout">
        <section>
            <div class="post-grid" th:unless="${blogPageResult == null or #lists.isEmpty(blogPageResult.list)}">
                <th:block th:each="blog : ${blogPageResult.list}">
                    <article th:replace="~{blog/amaze/fragments/post-card :: post-card(${blog})}"></article>
                </th:block>
            </div>
            <div class="empty-state" th:if="${blogPageResult == null or #lists.isEmpty(blogPageResult.list)}">
                <div class="empty-symbol">✦</div>
                <h2>没有找到相关文章</h2>
                <p>换个关键字试试，或者回到 <a th:href="@{/}">首页</a> 看看。</p>
            </div>

            <nav th:replace="~{blog/amaze/fragments/pagination :: pagination(${blogPageResult}, ${'/' + pageUrl + '/' + #uris.escapePathSegment(keyword) + '/'}, '')}"></nav>
        </section>

        <aside th:replace="~{blog/amaze/fragments/sidebar :: sidebar}"></aside>
    </div>
</main>

<footer th:replace="~{blog/amaze/layout :: footer}"></footer>
</body>
</html>
