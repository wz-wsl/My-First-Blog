<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<header th:replace="admin/header::header-fragment"></header>
<body>
<div class="admin-shell">
    <div th:replace="admin/sidebar::sidebar-fragment(${path})"></div>
    <div class="admin-main">
        <div th:replace="admin/header::header-nav"></div>

        <main class="admin-page">
            <div class="page-head">
                <div>
                    <p class="page-kicker">TEST</p>
                    <h1 class="page-title">图片上传测试</h1>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <!-- 上传按钮由 test.js 绑定 -->
                    <div class="toolbar">
                        <button class="btn btn-file" id="uploadButton"><i class="fa fa-upload"></i>上传图片</button>
                    </div>
                    <p class="page-desc">上传成功后图片会显示在下方。</p>
                    <img id="img" src="##">
                </div>
            </div>
        </main>

        <div th:replace="admin/footer::footer-fragment"></div>
    </div>
</div>

<!-- jQuery -->
<script th:src="@{/admin/plugins/jquery/jquery.min.js}"></script>
<!-- jQuery UI 1.11.4 -->
<script th:src="@{/admin/plugins/jQueryUI/jquery-ui.min.js}"></script>
<!-- Bootstrap 4 -->
<script th:src="@{/admin/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/admin/plugins/ajaxupload/ajaxupload.js}"></script>
<!-- 后台公共交互 -->
<script th:src="@{/admin/dist/js/admin.js}"></script>
<script th:src="@{/admin/dist/js/test.js}"></script>
</body>
</html>
