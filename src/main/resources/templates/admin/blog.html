<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<header th:replace="admin/header::header-fragment"></header>
<body>
<div class="admin-shell">
    <div th:replace="admin/sidebar::sidebar-fragment(${path})"></div>
    <div class="admin-main">
        <div th:replace="admin/header::header-nav"></div>

        <main class="admin-page">
            <div class="page-head">
                <div>
                    <p class="page-kicker">CONTENT / POSTS</p>
                    <h1 class="page-title">文章管理</h1>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary btn-raised" onclick="addBlog()"><i class="fa fa-pencil"></i>写新文章</button>
                </div>
            </div>

            <div class="card grid-wrap-text">
                <div class="card-body">
                    <!-- 工具栏：按钮的 onclick 对应 blog.js 中的函数 -->
                    <div class="toolbar">
                        <button class="btn btn-default" onclick="editBlog()"><i class="fa fa-edit"></i>修改</button>
                        <button class="btn btn-danger" onclick="deleteBlog()"><i class="fa fa-trash-o"></i>删除</button>
                        <span class="toolbar-spacer"></span>
                        <input type="text" placeholder="关键字（标题 / 分类）" id="keyword" class="form-control">
                        <button class="btn btn-default" onclick="search()"><i class="fa fa-search"></i>搜索</button>
                    </div>
                    <!-- jqGrid 必要 DOM：表格 + 分页 -->
                    <table id="jqGrid" class="table table-bordered"></table>
                    <div id="jqGridPager"></div>
                </div>
            </div>
        </main>

        <div th:replace="admin/footer::footer-fragment"></div>
    </div>
</div>

<!-- jQuery -->
<script th:src="@{/admin/plugins/jquery/jquery.min.js}"></script>
<!-- jQuery UI 1.11.4 -->
<script th:src="@{/admin/plugins/jQueryUI/jquery-ui.min.js}"></script>
<!-- Bootstrap 4 -->
<script th:src="@{/admin/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<!-- 后台公共交互 -->
<script th:src="@{/admin/dist/js/admin.js}"></script>
<!-- jqgrid -->
<script th:src="@{/admin/plugins/jqgrid-5.7.0/jquery.jqGrid.min.js}"></script>
<script th:src="@{/admin/plugins/jqgrid-5.7.0/grid.locale-cn.js}"></script>
<!-- sweetalert -->
<script th:src="@{/admin/plugins/sweetalert/sweetalert.min.js}"></script>
<script th:src="@{/admin/dist/js/public.js}"></script>
<script th:src="@{/admin/dist/js/blog.js}"></script>
</body>
</html>
