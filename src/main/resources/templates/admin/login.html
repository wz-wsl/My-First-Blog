<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 | My Blog</title>
    <link rel="shortcut icon" th:href="@{/admin/dist/img/favicon.png}"/>
    <link rel="stylesheet" th:href="@{/admin/dist/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/admin/plugins/bootstrap/css/bootstrap.css}"/>
    <link rel="stylesheet" th:href="@{/admin/dist/css/ink/admin.css}">
</head>
<body>
<div class="login-page">
    <!-- 左侧：品牌封面（小屏幕隐藏） -->
    <section class="login-cover">
        <div class="login-brand">我的博客<small>WRITER'S DESK</small></div>
        <p class="login-slogan">
            把想说的话，<br>慢慢写下来。
            <small>欢迎回来，今天也写点什么吧。</small>
        </p>
    </section>

    <!-- 右侧：登录表单，字段名和提交地址保持不变 -->
    <section class="login-panel">
        <form class="login-form" th:action="@{/admin/login}" method="post">
            <h1>登录后台</h1>
            <p class="page-desc">请输入账号、密码和验证码</p>

            <!-- 后端返回的错误信息 -->
            <div th:if="${not #strings.isEmpty(session.errorMsg)}" class="form-group">
                <div class="alert alert-danger" th:text="${session.errorMsg}"></div>
            </div>

            <div class="form-group">
                <label for="userName">账号</label>
                <input type="text" id="userName" name="userName" class="form-control" placeholder="请输入账号"
                       required="true">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="请输入密码"
                       required="true">
            </div>
            <div class="form-group">
                <label for="verifyCode">验证码</label>
                <div class="captcha-row">
                    <input type="text" id="verifyCode" class="form-control" name="verifyCode" placeholder="请输入验证码"
                           required="true">
                    <!-- 点击图片刷新验证码 -->
                    <img alt="单击图片刷新！" title="看不清？点击换一张" class="pointer" th:src="@{/common/kaptcha}"
                         onclick="this.src='/common/kaptcha?d='+new Date()*1">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-raised">登 录</button>
        </form>
    </section>
</div>
</body>
</html>
