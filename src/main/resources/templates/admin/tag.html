<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<header th:replace="admin/header::header-fragment"></header>
<body>
<div class="admin-shell">
    <div th:replace="admin/sidebar::sidebar-fragment(${path})"></div>
    <div class="admin-main">
        <div th:replace="admin/header::header-nav"></div>

        <main class="admin-page">
            <div class="page-head">
                <div>
                    <p class="page-kicker">CONTENT / TAGS</p>
                    <h1 class="page-title">标签管理</h1>
                    <p class="page-desc">写文章时输入的新标签会自动出现在这里。</p>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <!-- 工具栏：输入标签名后点「新增」，onclick 对应 tag.js 中的函数 -->
                    <div class="toolbar">
                        <input type="text" class="form-control" id="tagName" name="tagName"
                               placeholder="标签名称" required="true">
                        <button class="btn btn-primary" onclick="tagAdd()"><i class="fa fa-plus"></i>新增</button>
                        <span class="toolbar-spacer"></span>
                        <button class="btn btn-danger" onclick="deleteTag()"><i class="fa fa-trash-o"></i>删除</button>
                    </div>
                    <!-- jqGrid 必要 DOM：表格 + 分页 -->
                    <table id="jqGrid" class="table table-bordered"></table>
                    <div id="jqGridPager"></div>
                </div>
            </div>
        </main>

        <div th:replace="admin/footer::footer-fragment"></div>
    </div>
</div>

<!-- jQuery -->
<script th:src="@{/admin/plugins/jquery/jquery.min.js}"></script>
<!-- jQuery UI 1.11.4 -->
<script th:src="@{/admin/plugins/jQueryUI/jquery-ui.min.js}"></script>
<!-- Bootstrap 4 -->
<script th:src="@{/admin/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<!-- 后台公共交互 -->
<script th:src="@{/admin/dist/js/admin.js}"></script>
<!-- jqgrid -->
<script th:src="@{/admin/plugins/jqgrid-5.7.0/jquery.jqGrid.min.js}"></script>
<script th:src="@{/admin/plugins/jqgrid-5.7.0/grid.locale-cn.js}"></script>
<!-- sweetalert -->
<script th:src="@{/admin/plugins/sweetalert/sweetalert.min.js}"></script>
<script th:src="@{/admin/dist/js/public.js}"></script>
<script th:src="@{/admin/dist/js/tag.js}"></script>
</body>
</html>
