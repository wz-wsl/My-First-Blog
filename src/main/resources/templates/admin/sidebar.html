<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  侧边栏：参数 path 由后端传入，用来高亮当前菜单。
  每一项的写法都相同：序号 + 名称，当前页加 active 类。
-->
<aside th:fragment="sidebar-fragment(path)" class="admin-sidebar">
    <a class="sidebar-brand" th:href="@{/admin/index}">我的博客<small>WRITER'S DESK</small></a>

    <nav>
        <h6 class="nav-group-title">写作</h6>
        <a th:href="@{/admin/index}" th:classappend="${path}=='index' ? 'active'" class="nav-link-item">
            <span class="nav-no">01</span>概览
        </a>
        <a th:href="@{/admin/blogs/edit}" th:classappend="${path}=='edit' ? 'active'" class="nav-link-item">
            <span class="nav-no">02</span>写新文章
        </a>
    </nav>

    <nav>
        <h6 class="nav-group-title">内容</h6>
        <a th:href="@{/admin/blogs}" th:classappend="${path}=='blogs' ? 'active'" class="nav-link-item">
            <span class="nav-no">03</span>文章
        </a>
        <a th:href="@{/admin/comments}" th:classappend="${path}=='comments' ? 'active'" class="nav-link-item">
            <span class="nav-no">04</span>评论
        </a>
        <a th:href="@{/admin/categories}" th:classappend="${path}=='categories' ? 'active'" class="nav-link-item">
            <span class="nav-no">05</span>分类
        </a>
        <a th:href="@{/admin/tags}" th:classappend="${path}=='tags' ? 'active'" class="nav-link-item">
            <span class="nav-no">06</span>标签
        </a>
        <a th:href="@{/admin/links}" th:classappend="${path}=='links' ? 'active'" class="nav-link-item">
            <span class="nav-no">07</span>友链
        </a>
    </nav>

    <nav>
        <h6 class="nav-group-title">系统</h6>
        <a th:href="@{/admin/configurations}" th:classappend="${path}=='configurations' ? 'active'" class="nav-link-item">
            <span class="nav-no">08</span>站点配置
        </a>
        <a th:href="@{/admin/profile}" th:classappend="${path}=='profile' ? 'active'" class="nav-link-item">
            <span class="nav-no">09</span>账户安全
        </a>
    </nav>

    <!-- 当前登录用户：头像显示昵称的第一个字 -->
    <div class="sidebar-user">
        <span class="sidebar-avatar"
              th:text="${#strings.isEmpty(session.loginUser)} ? 'A' : ${#strings.substring(session.loginUser, 0, 1)}">A</span>
        <div>
            <span class="sidebar-user-name" th:text="${session.loginUser}">admin</span>
            <a class="sidebar-logout" th:href="@{/admin/logout}">退出登录</a>
        </div>
    </div>
</aside>
</html>
