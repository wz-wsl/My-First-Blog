<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<header th:replace="admin/header::header-fragment"></header>
<body>
<div class="admin-shell">
    <div th:replace="admin/sidebar::sidebar-fragment(${path})"></div>
    <div class="admin-main">
        <div th:replace="admin/header::header-nav"></div>

        <main class="admin-page">
            <!-- 问候语 + 主要操作 -->
            <div class="page-head">
                <div>
                    <p class="page-kicker">DASHBOARD</p>
                    <!-- 「上午好 / 下午好」由 dashboard.js 根据当前时间替换 -->
                    <h1 class="page-title"><span data-greeting>你好</span>，<em th:text="${session.loginUser}">admin</em>。</h1>
                </div>
                <div class="page-actions">
                    <a class="btn btn-default" th:href="@{/}" target="_blank">查看博客 ↗</a>
                    <a class="btn btn-primary btn-raised" th:href="@{/admin/blogs/edit}"><i class="fa fa-pencil"></i>写新文章</a>
                </div>
            </div>

            <!-- 数据栏：数字由后端直接渲染，点击跳转到对应管理页 -->
            <div class="stats">
                <a class="stat" th:href="@{/admin/blogs}">
                    <span class="stat-label">文章</span>
                    <b class="stat-value" th:text="${blogCount}">0</b>
                    <span class="stat-more">去管理 →</span>
                </a>
                <a class="stat" th:href="@{/admin/comments}">
                    <span class="stat-label">评论</span>
                    <b class="stat-value" th:text="${commentCount}">0</b>
                    <span class="stat-more">去审核 →</span>
                </a>
                <a class="stat" th:href="@{/admin/categories}">
                    <span class="stat-label">分类</span>
                    <b class="stat-value" th:text="${categoryCount}">0</b>
                    <span class="stat-more">去管理 →</span>
                </a>
                <a class="stat" th:href="@{/admin/tags}">
                    <span class="stat-label">标签</span>
                    <b class="stat-value" th:text="${tagCount}">0</b>
                    <span class="stat-more">去管理 →</span>
                </a>
                <a class="stat" th:href="@{/admin/links}">
                    <span class="stat-label">友链</span>
                    <b class="stat-value" th:text="${linkCount}">0</b>
                    <span class="stat-more">去管理 →</span>
                </a>
            </div>

            <div class="dash-grid">
                <!-- 最近文章：由 dashboard.js 读取已有的文章列表接口填充 -->
                <section>
                    <div class="section-head">
                        <h2>最近的文章</h2>
                        <a th:href="@{/admin/blogs}">全部文章 →</a>
                    </div>
                    <div id="recentPosts">
                        <p class="empty-tip">加载中…</p>
                    </div>
                </section>

                <!-- 最新评论：由 dashboard.js 读取已有的评论列表接口填充 -->
                <section>
                    <div class="section-head">
                        <h2>新评论</h2>
                        <a th:href="@{/admin/comments}">去审核 →</a>
                    </div>
                    <div class="comment-card" id="recentComments">
                        <p class="empty-tip">加载中…</p>
                    </div>
                    <div class="quote">「写作是一种整理自己的方式。」<small>— 今日一句</small></div>
                </section>
            </div>
        </main>

        <div th:replace="admin/footer::footer-fragment"></div>
    </div>
</div>

<!-- jQuery -->
<script th:src="@{/admin/plugins/jquery/jquery.min.js}"></script>
<!-- 后台公共交互 -->
<script th:src="@{/admin/dist/js/admin.js}"></script>
<!-- 概览页 -->
<script th:src="@{/admin/dist/js/dashboard.js}"></script>
</body>
</html>
