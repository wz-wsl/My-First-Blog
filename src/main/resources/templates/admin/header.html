<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!-- 公共 <head>：所有后台页面共用的 meta 和样式 -->
<head th:fragment="header-fragment">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台管理 | My Blog</title>
    <link rel="shortcut icon" th:href="@{/admin/dist/img/favicon.png}"/>
    <!-- 图标字体 -->
    <link rel="stylesheet" th:href="@{/admin/dist/css/font-awesome.min.css}">
    <!-- 第三方插件自带样式（栅格、弹窗、表格等） -->
    <link rel="stylesheet" th:href="@{/admin/plugins/bootstrap/css/bootstrap.css}"/>
    <link rel="stylesheet" th:href="@{/admin/plugins/sweetalert/sweetalert.css}"/>
    <link rel="stylesheet" th:href="@{/admin/plugins/jqgrid-5.7.0/ui.jqgrid-bootstrap4.css}"/>
    <!-- 后台主题「墨韵」，放在最后，覆盖上面插件的默认外观 -->
    <link rel="stylesheet" th:href="@{/admin/dist/css/ink/admin.css}">
</head>

<!-- 顶部栏：小屏幕菜单按钮 + 日期 + 快捷链接 -->
<header class="admin-topbar" th:fragment="header-nav">
    <button type="button" class="topbar-toggle" data-toggle-sidebar aria-label="打开菜单"
            aria-expanded="false" aria-controls="adminSidebar">
        <i class="fa fa-bars"></i>
    </button>
    <!-- 日期由 admin.js 填充 -->
    <span class="topbar-date" data-today></span>
    <nav class="topbar-actions">
        <a class="topbar-link" th:href="@{/}" target="_blank">查看博客 ↗</a>
        <a class="topbar-link" th:href="@{/admin/logout}">退出</a>
    </nav>
</header>
</html>
