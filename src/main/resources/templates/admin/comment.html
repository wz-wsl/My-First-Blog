<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<header th:replace="admin/header::header-fragment"></header>
<body>
<div class="admin-shell">
    <div th:replace="admin/sidebar::sidebar-fragment(${path})"></div>
    <div class="admin-main">
        <div th:replace="admin/header::header-nav"></div>

        <main class="admin-page">
            <div class="page-head">
                <div>
                    <p class="page-kicker">CONTENT / COMMENTS</p>
                    <h1 class="page-title">评论管理</h1>
                    <p class="page-desc">勾选评论后可以批量审核或删除。</p>
                </div>
            </div>

            <div class="card grid-wrap-text">
                <div class="card-body">
                    <!-- 工具栏：按钮的 onclick 对应 comment.js 中的函数 -->
                    <div class="toolbar">
                        <button class="btn btn-primary" onclick="checkDoneComments()"><i class="fa fa-check"></i>批量审核</button>
                        <button class="btn btn-default" onclick="reply()"><i class="fa fa-reply"></i>回复</button>
                        <button class="btn btn-danger" onclick="deleteComments()"><i class="fa fa-trash-o"></i>批量删除</button>
                    </div>
                    <!-- jqGrid 必要 DOM：表格 + 分页 -->
                    <table id="jqGrid" class="table table-bordered"></table>
                    <div id="jqGridPager"></div>
                </div>
            </div>
        </main>

        <div th:replace="admin/footer::footer-fragment"></div>
    </div>
</div>

<!-- 回复评论弹窗 -->
<div class="modal fade" id="replyModal" tabindex="-1" role="dialog" aria-labelledby="replyModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                        aria-hidden="true">&times;</span></button>
                <h6 class="modal-title" id="replyModalLabel">评论回复</h6>
            </div>
            <div class="modal-body">
                <form id="replyForm">
                    <input type="hidden" class="form-control" id="categoryId" name="categoryId">
                    <div class="form-group">
                        <label for="replyBody" class="control-label">回复内容</label>
                        <textarea class="form-control" id="replyBody" name="replyBody"
                                  placeholder="请输入回复内容" required="true"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveButton">确认</button>
            </div>
        </div>
    </div>
</div>

<!-- jQuery -->
<script th:src="@{/admin/plugins/jquery/jquery.min.js}"></script>
<!-- jQuery UI 1.11.4 -->
<script th:src="@{/admin/plugins/jQueryUI/jquery-ui.min.js}"></script>
<!-- Bootstrap 4 -->
<script th:src="@{/admin/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<!-- 后台公共交互 -->
<script th:src="@{/admin/dist/js/admin.js}"></script>
<!-- jqgrid -->
<script th:src="@{/admin/plugins/jqgrid-5.7.0/jquery.jqGrid.min.js}"></script>
<script th:src="@{/admin/plugins/jqgrid-5.7.0/grid.locale-cn.js}"></script>
<!-- sweetalert -->
<script th:src="@{/admin/plugins/sweetalert/sweetalert.min.js}"></script>
<script th:src="@{/admin/dist/js/public.js}"></script>
<script th:src="@{/admin/dist/js/comment.js}"></script>
</body>
</html>
