server.port = 8080
# 会话 Cookie：禁止脚本读取；SameSite=Lax 阻止其他网站跨站提交后台表单
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.cache=false

# 上传目录：部署时用环境变量 UPLOAD_DIR 覆盖，例如 Linux 上的 /var/my-blog/upload/
config.FILE_UPLOAD_DIC = ${UPLOAD_DIR:D:/Program/my_blog_update/}
config.theme = amaze

# datasource config（账号密码可用环境变量 DB_URL / DB_USERNAME / DB_PASSWORD 覆盖，线上不要用 root）
spring.datasource.name=my-blog-datasource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/my_blog_db?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=hikariCP
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# mybatis config
mybatis.mapper-locations=classpath:mapper/*Mapper.xml
mybatis.configuration.map-underscore-to-camel-case=true