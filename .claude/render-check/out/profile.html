<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台管理 | My Blog</title>
    <link rel="shortcut icon" href="/admin/dist/img/favicon.png"/>
    <!-- 图标字体 -->
    <link rel="stylesheet" href="/admin/dist/css/font-awesome.min.css">
    <!-- 第三方插件自带样式（栅格、弹窗、表格等） -->
    <link rel="stylesheet" href="/admin/plugins/bootstrap/css/bootstrap.css"/>
    <link rel="stylesheet" href="/admin/plugins/sweetalert/sweetalert.css"/>
    <link rel="stylesheet" href="/admin/plugins/jqgrid-5.7.0/ui.jqgrid-bootstrap4.css"/>
    <!-- 后台主题「墨韵」，放在最后，覆盖上面插件的默认外观 -->
    <link rel="stylesheet" href="/admin/dist/css/ink/admin.css">
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar">
    <a class="sidebar-brand" href="/admin/index">我的博客<small>WRITER'S DESK</small></a>

    <nav>
        <h6 class="nav-group-title">写作</h6>
        <a href="/admin/index" class="nav-link-item">
            <span class="nav-no">01</span>概览
        </a>
        <a href="/admin/blogs/edit" class="nav-link-item">
            <span class="nav-no">02</span>写新文章
        </a>
    </nav>

    <nav>
        <h6 class="nav-group-title">内容</h6>
        <a href="/admin/blogs" class="nav-link-item">
            <span class="nav-no">03</span>文章
        </a>
        <a href="/admin/comments" class="nav-link-item">
            <span class="nav-no">04</span>评论
        </a>
        <a href="/admin/categories" class="nav-link-item">
            <span class="nav-no">05</span>分类
        </a>
        <a href="/admin/tags" class="nav-link-item">
            <span class="nav-no">06</span>标签
        </a>
        <a href="/admin/links" class="nav-link-item">
            <span class="nav-no">07</span>友链
        </a>
    </nav>

    <nav>
        <h6 class="nav-group-title">系统</h6>
        <a href="/admin/configurations" class="nav-link-item">
            <span class="nav-no">08</span>站点配置
        </a>
        <a href="/admin/profile" class="nav-link-item active">
            <span class="nav-no">09</span>账户安全
        </a>
    </nav>

    <!-- 当前登录用户：头像显示昵称的第一个字 -->
    <div class="sidebar-user">
        <span class="sidebar-avatar">十</span>
        <div>
            <span class="sidebar-user-name">十三</span>
            <a class="sidebar-logout" href="/admin/logout">退出登录</a>
        </div>
    </div>
</aside>
    <div class="admin-main">
        <header class="admin-topbar">
    <button type="button" class="topbar-toggle" data-toggle-sidebar aria-label="打开菜单">
        <i class="fa fa-bars"></i>
    </button>
    <!-- 日期由 admin.js 填充 -->
    <span class="topbar-date" data-today></span>
    <nav class="topbar-actions">
        <a class="topbar-link" href="/" target="_blank">查看博客 ↗</a>
        <a class="topbar-link" href="/admin/logout">退出</a>
    </nav>
</header>

        <main class="admin-page">
            <div class="page-head">
                <div>
                    <p class="page-kicker">SYSTEM / ACCOUNT</p>
                    <h1 class="page-title">账户安全</h1>
                    <p class="page-desc">修改密码成功后需要重新登录。</p>
                </div>
            </div>

            <!-- 两张卡片的表单 id、字段名、按钮 id 都对应 profile.js -->
            <div class="settings-grid">
                <div class="card">
                    <div class="card-header">
                        <div>
                            <h3 class="card-title">基本信息</h3>
                            <p class="card-desc">登录名称与显示昵称</p>
                        </div>
                    </div>
                    <div class="card-body">
                        <form role="form" id="userNameForm">
                            <div class="alert alert-danger" id="updateUserName-info" style="display: none;"></div>
                            <div class="form-group">
                                <label for="loginUserName">登录名称</label>
                                <input type="text" class="form-control" id="loginUserName"
                                       name="loginUserName"
                                       placeholder="请输入登录名称" required="true" value="admin">
                            </div>
                            <div class="form-group">
                                <label for="nickName">昵称</label>
                                <input type="text" class="form-control" id="nickName"
                                       name="nickName"
                                       placeholder="请输入昵称" required="true" value="十三">
                            </div>
                            <div class="card-footer">
                                <button type="button" id="updateUserNameButton" onsubmit="return false;"
                                        class="btn btn-primary">保存修改
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h3 class="card-title">修改密码</h3>
                            <p class="card-desc">请先输入原密码进行验证</p>
                        </div>
                    </div>
                    <div class="card-body">
                        <form role="form" id="userPasswordForm">
                            <div class="alert alert-danger updatePassword-info" id="updatePassword-info" style="display: none;"></div>
                            <div class="form-group">
                                <label for="originalPassword"><i class="fa fa-key"></i> 原密码</label>
                                <input type="text" class="form-control" id="originalPassword"
                                       name="originalPassword"
                                       placeholder="请输入原密码" required="true">
                            </div>
                            <div class="form-group">
                                <label for="newPassword"><i class="fa fa-key"></i> 新密码</label>
                                <input type="text" class="form-control" id="newPassword" name="newPassword"
                                       placeholder="请输入新密码" required="true">
                            </div>
                            <div class="card-footer">
                                <button type="button" id="updatePasswordButton" onsubmit="return false;"
                                        class="btn btn-danger">修改密码
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <footer class="admin-footer">
    <span>Copyright &copy; 2018 <a href="##">13blog.site</a>. All rights reserved.</span>
    <span>my personal blog · v1.0</span>
</footer>
    </div>
</div>

<!-- jQuery -->
<script src="/admin/plugins/jquery/jquery.min.js"></script>
<!-- jQuery UI 1.11.4 -->
<script src="/admin/plugins/jQueryUI/jquery-ui.min.js"></script>
<!-- Bootstrap 4 -->
<script src="/admin/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<!-- 后台公共交互 -->
<script src="/admin/dist/js/admin.js"></script>
<!-- public.js -->
<script src="/admin/dist/js/public.js"></script>
<!-- profile -->
<script src="/admin/dist/js/profile.js"></script>
</body>
</html>
