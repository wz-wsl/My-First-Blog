<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台管理 | My Blog</title>
    <link rel="shortcut icon" href="/admin/dist/img/favicon.png"/>
    <!-- 图标字体 -->
    <link rel="stylesheet" href="/admin/dist/css/font-awesome.min.css">
    <!-- 第三方插件自带样式（栅格、弹窗、表格等） -->
    <link rel="stylesheet" href="/admin/plugins/bootstrap/css/bootstrap.css"/>
    <link rel="stylesheet" href="/admin/plugins/sweetalert/sweetalert.css"/>
    <link rel="stylesheet" href="/admin/plugins/jqgrid-5.7.0/ui.jqgrid-bootstrap4.css"/>
    <!-- 后台主题「墨韵」，放在最后，覆盖上面插件的默认外观 -->
    <link rel="stylesheet" href="/admin/dist/css/ink/admin.css">
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar">
    <a class="sidebar-brand" href="/admin/index">我的博客<small>WRITER'S DESK</small></a>

    <nav>
        <h6 class="nav-group-title">写作</h6>
        <a href="/admin/index" class="nav-link-item">
            <span class="nav-no">01</span>概览
        </a>
        <a href="/admin/blogs/edit" class="nav-link-item">
            <span class="nav-no">02</span>写新文章
        </a>
    </nav>

    <nav>
        <h6 class="nav-group-title">内容</h6>
        <a href="/admin/blogs" class="nav-link-item">
            <span class="nav-no">03</span>文章
        </a>
        <a href="/admin/comments" class="nav-link-item">
            <span class="nav-no">04</span>评论
        </a>
        <a href="/admin/categories" class="nav-link-item active">
            <span class="nav-no">05</span>分类
        </a>
        <a href="/admin/tags" class="nav-link-item">
            <span class="nav-no">06</span>标签
        </a>
        <a href="/admin/links" class="nav-link-item">
            <span class="nav-no">07</span>友链
        </a>
    </nav>

    <nav>
        <h6 class="nav-group-title">系统</h6>
        <a href="/admin/configurations" class="nav-link-item">
            <span class="nav-no">08</span>站点配置
        </a>
        <a href="/admin/profile" class="nav-link-item">
            <span class="nav-no">09</span>账户安全
        </a>
    </nav>

    <!-- 当前登录用户：头像显示昵称的第一个字 -->
    <div class="sidebar-user">
        <span class="sidebar-avatar">十</span>
        <div>
            <span class="sidebar-user-name">十三</span>
            <a class="sidebar-logout" href="/admin/logout">退出登录</a>
        </div>
    </div>
</aside>
    <div class="admin-main">
        <header class="admin-topbar">
    <button type="button" class="topbar-toggle" data-toggle-sidebar aria-label="打开菜单">
        <i class="fa fa-bars"></i>
    </button>
    <!-- 日期由 admin.js 填充 -->
    <span class="topbar-date" data-today></span>
    <nav class="topbar-actions">
        <a class="topbar-link" href="/" target="_blank">查看博客 ↗</a>
        <a class="topbar-link" href="/admin/logout">退出</a>
    </nav>
</header>

        <main class="admin-page">
            <div class="page-head">
                <div>
                    <p class="page-kicker">CONTENT / CATEGORIES</p>
                    <h1 class="page-title">分类管理</h1>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary btn-raised" onclick="categoryAdd()"><i class="fa fa-plus"></i>新增分类</button>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <!-- 工具栏：按钮的 onclick 对应 category.js 中的函数 -->
                    <div class="toolbar">
                        <button class="btn btn-default" onclick="categoryEdit()"><i class="fa fa-pencil-square-o"></i>修改</button>
                        <button class="btn btn-danger" onclick="deleteCagegory()"><i class="fa fa-trash-o"></i>删除</button>
                    </div>
                    <!-- jqGrid 必要 DOM：表格 + 分页 -->
                    <table id="jqGrid" class="table table-bordered"></table>
                    <div id="jqGridPager"></div>
                </div>
            </div>
        </main>

        <footer class="admin-footer">
    <span>Copyright &copy; 2018 <a href="##">13blog.site</a>. All rights reserved.</span>
    <span>my personal blog · v1.0</span>
</footer>
    </div>
</div>

<!-- 新增 / 修改分类弹窗，标题由 category.js 设置 -->
<div class="modal fade" id="categoryModal" tabindex="-1" role="dialog" aria-labelledby="categoryModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                        aria-hidden="true">&times;</span></button>
                <h6 class="modal-title" id="categoryModalLabel">Modal</h6>
            </div>
            <div class="modal-body">
                <form id="categoryForm">
                    <div class="form-group">
                        <div class="alert alert-danger" id="edit-error-msg" style="display: none;">
                            错误信息展示栏。
                        </div>
                    </div>
                    <input type="hidden" class="form-control" id="categoryId" name="categoryId">
                    <div class="form-group">
                        <label for="categoryName" class="control-label">分类名称</label>
                        <input type="text" class="form-control" id="categoryName" name="categoryName"
                               placeholder="请输入分类名称" required="true">
                    </div>
                    <div class="form-group">
                        <label for="categoryIcon" class="control-label">分类图标</label>
                        <!-- image-picker 会在下拉框下方生成可点击的图标列表 -->
                        <select class='form-control select2 image-picker' id="categoryIcon"
                                name="categoryIcon">
                            <option data-img-src='/admin/dist/img/category/00.png' value='/admin/dist/img/category/00.png'> 默认图标</option>
                            <option data-img-src='/admin/dist/img/category/01.png' value='/admin/dist/img/category/01.png'> 图标1</option>
                            <option data-img-src='/admin/dist/img/category/02.png' value='/admin/dist/img/category/02.png'> 图标2</option>
                            <option data-img-src='/admin/dist/img/category/03.png' value='/admin/dist/img/category/03.png'> 图标3</option>
                            <option data-img-src='/admin/dist/img/category/04.png' value='/admin/dist/img/category/04.png'> 图标4</option>
                            <option data-img-src='/admin/dist/img/category/05.png' value='/admin/dist/img/category/05.png'> 图标5</option>
                            <option data-img-src='/admin/dist/img/category/06.png' value='/admin/dist/img/category/06.png'> 图标6</option>
                            <option data-img-src='/admin/dist/img/category/07.png' value='/admin/dist/img/category/07.png'> 图标7</option>
                            <option data-img-src='/admin/dist/img/category/08.png' value='/admin/dist/img/category/08.png'> 图标8</option>
                            <option data-img-src='/admin/dist/img/category/09.png' value='/admin/dist/img/category/09.png'> 图标9</option>
                            <option data-img-src='/admin/dist/img/category/10.png' value='/admin/dist/img/category/10.png'> 图标10</option>
                            <option data-img-src='/admin/dist/img/category/11.png' value='/admin/dist/img/category/11.png'> 图标11</option>
                            <option data-img-src='/admin/dist/img/category/12.png' value='/admin/dist/img/category/12.png'> 图标12</option>
                            <option data-img-src='/admin/dist/img/category/13.png' value='/admin/dist/img/category/13.png'> 图标13</option>
                            <option data-img-src='/admin/dist/img/category/14.png' value='/admin/dist/img/category/14.png'> 图标14</option>
                            <option data-img-src='/admin/dist/img/category/15.png' value='/admin/dist/img/category/15.png'> 图标15</option>
                            <option data-img-src='/admin/dist/img/category/16.png' value='/admin/dist/img/category/16.png'> 图标16</option>
                            <option data-img-src='/admin/dist/img/category/17.png' value='/admin/dist/img/category/17.png'> 图标17</option>
                            <option data-img-src='/admin/dist/img/category/18.png' value='/admin/dist/img/category/18.png'> 图标18</option>
                            <option data-img-src='/admin/dist/img/category/19.png' value='/admin/dist/img/category/19.png'> 图标19</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveButton">确认</button>
            </div>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="/admin/plugins/jquery/jquery.min.js"></script>
<!-- jQuery UI 1.11.4 -->
<script src="/admin/plugins/jQueryUI/jquery-ui.min.js"></script>
<!-- Bootstrap 4 -->
<script src="/admin/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<!-- 后台公共交互 -->
<script src="/admin/dist/js/admin.js"></script>
<!-- jqgrid -->
<script src="/admin/plugins/jqgrid-5.7.0/jquery.jqGrid.min.js"></script>
<script src="/admin/plugins/jqgrid-5.7.0/grid.locale-cn.js"></script>
<!-- image-picker -->
<script src="/admin/plugins/image-picker/query.masonry.min.js"></script>
<script src="/admin/plugins/image-picker/image-picker.min.js"></script>
<!-- sweetalert -->
<script src="/admin/plugins/sweetalert/sweetalert.min.js"></script>
<script src="/admin/dist/js/public.js"></script>
<script src="/admin/dist/js/category.js"></script>
</body>
</html>
