<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台管理 | My Blog</title>
    <link rel="shortcut icon" href="/admin/dist/img/favicon.png"/>
    <!-- 图标字体 -->

    <link rel="stylesheet" href="/admin/plugins/bootstrap/css/bootstrap.css"/>
    <link rel="stylesheet" href="/admin/plugins/sweetalert/sweetalert.css"/>
    <link rel="stylesheet" href="/admin/plugins/jqgrid-5.7.0/ui.jqgrid-bootstrap4.css"/>
    <!-- 后台主题「墨韵」，放在最后，覆盖上面插件的默认外观 -->

</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar">
    <a class="sidebar-brand" href="/admin/index">我的博客<small>WRITER'S DESK</small></a>

    <nav>
        <h6 class="nav-group-title">写作</h6>
        <a href="/admin/index" class="nav-link-item">
            <span class="nav-no">01</span>概览
        </a>
        <a href="/admin/blogs/edit" class="nav-link-item">
            <span class="nav-no">02</span>写新文章
        </a>
    </nav>

    <nav>
        <h6 class="nav-group-title">内容</h6>
        <a href="/admin/blogs" class="nav-link-item">
            <span class="nav-no">03</span>文章
        </a>
        <a href="/admin/comments" class="nav-link-item">
            <span class="nav-no">04</span>评论
        </a>
        <a href="/admin/categories" class="nav-link-item">
            <span class="nav-no">05</span>分类
        </a>
        <a href="/admin/tags" class="nav-link-item">
            <span class="nav-no">06</span>标签
        </a>
        <a href="/admin/links" class="nav-link-item active">
            <span class="nav-no">07</span>友链
        </a>
    </nav>

    <nav>
        <h6 class="nav-group-title">系统</h6>
        <a href="/admin/configurations" class="nav-link-item">
            <span class="nav-no">08</span>站点配置
        </a>
        <a href="/admin/profile" class="nav-link-item">
            <span class="nav-no">09</span>账户安全
        </a>
    </nav>

    <!-- 当前登录用户：头像显示昵称的第一个字 -->
    <div class="sidebar-user">
        <span class="sidebar-avatar">十</span>
        <div>
            <span class="sidebar-user-name">十三</span>
            <a class="sidebar-logout" href="/admin/logout">退出登录</a>
        </div>
    </div>
</aside>
    <div class="admin-main">
        <header class="admin-topbar">
    <button type="button" class="topbar-toggle" data-toggle-sidebar aria-label="打开菜单">
        <i class="fa fa-bars"></i>
    </button>
    <!-- 日期由 admin.js 填充 -->
    <span class="topbar-date" data-today></span>
    <nav class="topbar-actions">
        <a class="topbar-link" href="/" target="_blank">查看博客 ↗</a>
        <a class="topbar-link" href="/admin/logout">退出</a>
    </nav>
</header>

        <main class="admin-page">
            <div class="page-head">
                <div>
                    <p class="page-kicker">CONTENT / LINKS</p>
                    <h1 class="page-title">友情链接</h1>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary btn-raised" onclick="linkAdd()"><i class="fa fa-plus"></i>新增链接</button>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <!-- 工具栏：按钮的 onclick 对应 link.js 中的函数 -->
                    <div class="toolbar">
                        <button class="btn btn-default" onclick="linkEdit()"><i class="fa fa-pencil-square-o"></i>修改</button>
                        <button class="btn btn-danger" onclick="deleteLink()"><i class="fa fa-trash-o"></i>删除</button>
                    </div>
                    <!-- jqGrid 必要 DOM：表格 + 分页 -->
                    <table id="jqGrid" class="table table-bordered"></table>
                    <div id="jqGridPager"></div>
                </div>
            </div>
        </main>

        <footer class="admin-footer">
    <span>Copyright &copy; 2018 <a href="##">13blog.site</a>. All rights reserved.</span>
    <span>my personal blog · v1.0</span>
</footer>
    </div>
</div>

<!-- 新增 / 修改友链弹窗，标题由 link.js 设置 -->
<div class="modal fade" id="linkModal" tabindex="-1" role="dialog" aria-labelledby="linkModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                        aria-hidden="true">&times;</span></button>
                <h6 class="modal-title" id="linkModalLabel">Modal</h6>
            </div>
            <div class="modal-body">
                <form id="linkForm">
                    <div class="form-group">
                        <div class="alert alert-danger" id="edit-error-msg" style="display: none;">
                            错误信息展示栏。
                        </div>
                    </div>
                    <input type="hidden" class="form-control" id="linkId" name="linkId">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="linkType" class="control-label">友链类型</label>
                            <select class="form-control" id="linkType" name="linkType">
                                <option selected="selected" value="0">友链</option>
                                <option value="1">推荐网站</option>
                                <option value="2">个人链接</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="linkRank" class="control-label">排序值</label>
                            <input type="number" class="form-control" id="linkRank" name="linkRank"
                                   placeholder="请输入排序值" required="true">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="linkName" class="control-label">网站名称</label>
                        <input type="text" class="form-control" id="linkName" name="linkName"
                               placeholder="请输入网站名称" required="true">
                    </div>
                    <div class="form-group">
                        <label for="linkUrl" class="control-label">网站链接</label>
                        <input type="url" class="form-control" id="linkUrl" name="linkUrl"
                               placeholder="请输入网站链接" required="true">
                    </div>
                    <div class="form-group">
                        <label for="linkDescription" class="control-label">网站描述</label>
                        <input type="url" class="form-control" id="linkDescription" name="linkDescription"
                               placeholder="请输入网站描述" required="true">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveButton">确认</button>
            </div>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="/admin/plugins/jquery/jquery.min.js"></script>
<!-- jQuery UI 1.11.4 -->
<script src="/admin/plugins/jQueryUI/jquery-ui.min.js"></script>
<!-- Bootstrap 4 -->
<script src="/admin/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<!-- 后台公共交互 -->
<script src="/admin/dist/js/admin.js"></script>
<!-- jqgrid -->
<script src="/admin/plugins/jqgrid-5.7.0/jquery.jqGrid.min.js"></script>
<script src="/admin/plugins/jqgrid-5.7.0/grid.locale-cn.js"></script>
<!-- sweetalert -->
<script src="/admin/plugins/sweetalert/sweetalert.min.js"></script>
<script src="/admin/dist/js/public.js"></script>
<script src="/admin/dist/js/link.js"></script>
</body>
</html>
